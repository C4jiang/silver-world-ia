  --pink: #ffb0be;

html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--white); font-family: var(--font); overflow: hidden;
  overscroll-behavior: none; touch-action: none; -webkit-font-smoothing: antialiased; }
canvas { display: block; }
#stage, #smoke { position: fixed; inset: 0; width: 100%; height: 100%; }
#smoke { pointer-events: none; }
#flash { position: fixed; inset: 0; background: #fffbea; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
#lines { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.layer { position: fixed; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cue { position: absolute; opacity: 0; will-change: opacity, transform; transition: color .4s; }
.cue { text-shadow: 0 1px 14px rgba(5,8,24,.9), 0 0 3px rgba(5,8,24,.6); }
.cue.sea { color: var(--ink); text-shadow: 0 0 12px rgba(238,243,252,.95), 0 0 3px rgba(238,243,252,.9); }
.motto { text-shadow: 0 1px 14px rgba(5,8,24,.9); }
.cue.sea .beat p, .cue.sea .hdr, .cue.sea .lead { color: #4a5a7a; }
.cue.sea .badge { background: var(--ink); color: var(--white); }
/* title + motto */
.title { left: max(56px, calc(env(safe-area-inset-left, 0px) + 56px)); top: 9vh; }
.title h1 { margin: 0; font-weight: 500; font-size: clamp(40px, 6.2vw, 92px); letter-spacing: .01em; line-height: 1; }

.hint svg { display: block; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(3px); } 50% { transform: translateY(-4px); } }

#words { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center;

@media (max-width: 760px) {

  .cue.rules { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; top: 9vh; }
  .motto { letter-spacing: .06em; }
  #lines { display: none; }

// ---------------------------------------------------------------- input: a virtual scroll that loops both ways (up = climb)

function resize() {
